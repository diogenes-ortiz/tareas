<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANM Studio — Task Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0F1117;--card:#181A23;--surface:#1E2029;--col-hover:#252731;--border:#2A2D3A;--text:#E8ECF4;--sub:#9CA3B4;--muted:#5C6278;--accent:#4F8CFF;--accent-soft:rgba(79,140,255,.09);--accent-hover:#3A75E8;--input:#1A1C26}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
select{appearance:auto;font-family:inherit}
button{font-family:inherit}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
#app{display:flex;min-height:100vh}
#sidebar{width:220px;flex-shrink:0;padding:20px 14px;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#content{flex:1;overflow:auto;padding:20px 24px}

/* Sidebar */
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.sb-logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#7C3AED,#2563EB);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px}
.sb-title{font-size:14px;font-weight:900;color:var(--text)}
.sb-sub{font-size:10px;color:var(--muted)}
.sb-nav{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;border-radius:8px;border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:500;cursor:pointer;text-align:left}
.sb-nav.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sb-nav:hover{background:var(--accent-soft)}
.sb-section{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px;margin:20px 0 6px}
.sb-client{display:flex;gap:2px}
.sb-client-btn{display:flex;align-items:center;gap:9px;flex:1;padding:7px 12px;border-radius:8px 0 0 8px;border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:500;cursor:pointer;text-align:left}
.sb-client-btn.active{font-weight:700}
.sb-client-portal{padding:7px 8px;border-radius:0 8px 8px 0;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center}
.sb-team{display:flex;align-items:center;gap:8px;padding:5px 12px}
.sb-team-name{font-size:11px;font-weight:700;color:var(--text)}
.sb-team-role{font-size:9px;color:var(--muted)}

/* Avatar */
.av{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}

/* Cards */
.card{background:var(--card);border-radius:12px;padding:18px 20px;border:1px solid var(--border)}
.stat-num{font-size:28px;font-weight:900;line-height:1;letter-spacing:-0.03em}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}

/* Chart row */
.chart-row{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:16px}

/* Table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th{text-align:left;padding:10px 12px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;border-bottom:2px solid var(--border)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border)}
.tbl tr:hover td{background:var(--surface)}
.tbl tr{cursor:pointer}

/* Badge */
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block}

/* Task card */
.task-card{background:var(--card);border-radius:10px;padding:13px 15px;margin-bottom:7px;border:1px solid var(--border);cursor:grab;transition:box-shadow .12s,transform .12s}
.task-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);transform:translateY(-1px)}
.task-card.client-mode{cursor:pointer}

/* Column */
.col{flex:1 1 260px;min-width:250;max-width:340px;background:var(--surface);border-radius:14px;padding:10px 10px 6px;display:flex;flex-direction:column;transition:background .1s}
.col.drag-over{background:var(--col-hover)}
.col-header{display:flex;align-items:center;gap:7px;padding:6px 6px 12px}
.col-dot{width:8px;height:8px;border-radius:50%}
.col-title{font-size:12px;font-weight:800;color:var(--text)}
.col-count{margin-left:auto;font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px}
.col-body{flex:1;overflow-y:auto;min-height:40px}

/* Board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(6px);animation:fadeIn .12s ease}
.modal-box{background:var(--card);border-radius:16px;width:100%;padding:28px 32px;box-shadow:0 30px 80px rgba(0,0,0,.25),0 0 0 1px var(--border);animation:slideUp .18s ease}
.modal-box.normal{max-width:540px}
.modal-box.wide{max-width:720px}

/* Inputs */
.inp{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--accent)}
.lbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.btn{padding:9px 24px;border-radius:8px;border:none;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--sub)}
.btn-danger{background:#FEF2F2;border:1px solid #FCA5A5;color:#DC2626}

/* Mini stat (client portal) */
.mini-stat{text-align:center;padding:12px 16px;background:var(--surface);border-radius:10px;flex:1 1 90px}
.mini-stat-num{font-size:22px;font-weight:900;letter-spacing:-0.03em}
.mini-stat-label{font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}

/* Color/emoji pickers */
.color-pick{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border .1s}
.color-pick.sel{border-color:var(--text)}
.emoji-pick{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.emoji-pick.sel{background:var(--accent)}

/* Settings item */
.settings-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:4px;background:var(--surface)}

/* Status move btns */
.move-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s}
.move-btn:hover{opacity:.8}

/* Progress bar */
.prog-bar{height:7px;border-radius:4px;background:var(--surface);overflow:hidden;min-width:80px}
.prog-fill{height:100%;border-radius:4px;transition:width .4s}

/* Team bar */
.team-bar{display:flex;gap:4px;margin-top:5px}
.team-bar-seg{height:5px;border-radius:3px}

/* Activity dot */
.act-dot{width:5px;height:5px;border-radius:50%;background:var(--border);flex-shrink:0}

/* Client portal header */
.portal-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--card)}
.portal-stats{display:flex;gap:8px;margin-top:14px}

/* Empty state */
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty-title{font-size:17px;font-weight:800;color:var(--sub);margin-bottom:8px}
.empty-sub{font-size:13px;margin-bottom:24px}

/* Responsive */
@media(max-width:768px){
  #sidebar{display:none}
  .chart-row{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
}

/* Loading */
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

/* Table-dashboard specific */
.dash-tbl td{text-align:center}
.dash-tbl td:first-child{text-align:left}
.dash-tbl td:last-child{text-align:left}
.status-cell{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:32px;border-radius:8px;font-size:15px;font-weight:900;padding:0 10px}

/* Tabs */
.tab-btn{padding:8px 18px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:not(.active){background:var(--surface);color:var(--sub)}

.hidden{display:none!important}
.link-item{transition:background .1s}
.link-item:hover{background:var(--col-hover)!important}
</style>
</head>
<body>
<div id="app-loading" class="loading">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:13px;font-weight:600">Cargando...</div>
</div>
<div id="app" class="hidden"></div>

<script>
/* ═══════════════════════════════════════════
   DATA & STATE
   ═══════════════════════════════════════════ */
const DEF_CLIENTS=[{id:"froz",name:"Froz",color:"#06B6D4",icon:"🧊"},{id:"mipileta",name:"Mi Pileta",color:"#2563EB",icon:"🚿"},{id:"antequera",name:"Antequera",color:"#D97706",icon:"🏡"},{id:"anm",name:"ANM Content Studio",color:"#7C3AED",icon:"🎬"},{id:"avanti",name:"Avanti",color:"#059669",icon:"🚀"}];
const DEF_TEAM=[{id:"santi",name:"Santiago",role:"Fundador",color:"#2563EB"},{id:"dio",name:"Diógenes",role:"Fundador",color:"#7C3AED"},{id:"luisina",name:"Luisina",role:"Social Media Manager",color:"#EC4899"},{id:"lucia",name:"Lucía",role:"Diseñadora",color:"#10B981"}];
const PRIORITIES={urgente:{label:"Urgente",bg:"#FEE2E2",text:"#991B1B",dot:"#DC2626"},alta:{label:"Alta",bg:"#FFEDD5",text:"#9A3412",dot:"#F97316"},media:{label:"Media",bg:"#FEF3C7",text:"#92400E",dot:"#F59E0B"},baja:{label:"Baja",bg:"#DBEAFE",text:"#1E40AF",dot:"#3B82F6"}};
const CATS=["Web / eCommerce","Diseño Gráfico","Redes Sociales","Contenido / Copy","Email Marketing","SEO / SEM","Datos / Analytics","Estrategia","Reunión","Otro"];
const STS=[{id:"backlog",label:"Backlog",icon:"⊘",color:"#94A3B8"},{id:"pendiente",label:"Pendiente",icon:"○",color:"#64748B"},{id:"en_progreso",label:"En Progreso",icon:"◐",color:"#3B82F6"},{id:"revision",label:"En Revisión",icon:"◑",color:"#F59E0B"},{id:"completada",label:"Completada",icon:"●",color:"#10B981"}];
const BOARD_STS=STS.filter(s=>s.id!=="backlog");
const EMOJIS=["🧊","🚿","🏡","🎬","🚀","🏢","💎","🔥","⚡","🎯","🌟","📱","🛍️","🍕","🎨","💄","👗","🏋️","🌿","🐾"];
const PALETTE=["#2563EB","#7C3AED","#06B6D4","#D97706","#059669","#EC4899","#EF4444","#F59E0B","#10B981","#64748B","#8B5CF6","#14B8A6"];

const uid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,6);
const fmtD=d=>d?new Date(d).toLocaleDateString("es-AR",{day:"2-digit",month:"short"}):"";
const tAgo=iso=>{const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return"ahora";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";if(s<604800)return Math.floor(s/86400)+"d";return fmtD(iso)};
const isOD=d=>d&&new Date(d)<new Date(new Date().toDateString());
const isPar=t=>{if(t.status==="completada"||t.status==="backlog"||!t.updatedAt)return false;return(Date.now()-new Date(t.updatedAt))/864e5>3};

// State
let state={
  tasks:JSON.parse(localStorage.getItem("anm-tasks-v6")||"[]"),
  clients:JSON.parse(localStorage.getItem("anm-clients-v6")||JSON.stringify(DEF_CLIENTS)),
  team:JSON.parse(localStorage.getItem("anm-team-v6")||JSON.stringify(DEF_TEAM)),
  view:"dashboard",
  clientFilter:"all",
  clientPortal:null,
  search:"",
  filterPriority:"all",
  filterAssignee:"all",
  selectedTask:null,
  showForm:false,
  showSettings:false,
  settingsTab:"clients",
  editingConfig:null,
  editingForm:{}
};

function saveState(){
  localStorage.setItem("anm-tasks-v6",JSON.stringify(state.tasks));
  localStorage.setItem("anm-clients-v6",JSON.stringify(state.clients));
  localStorage.setItem("anm-team-v6",JSON.stringify(state.team));
}

function setState(updates){
  Object.assign(state,updates);
  saveState();
  render();
}

// Task operations
function saveTask(task){
  const i=state.tasks.findIndex(t=>t.id===task.id);
  if(i>=0)state.tasks[i]=task;
  else state.tasks.unshift(task);
  if(state.selectedTask?.id===task.id)state.selectedTask=task;
  saveState();render();
}
function deleteTask(id){state.tasks=state.tasks.filter(t=>t.id!==id);state.selectedTask=null;saveState();render();}
function moveTask(id,ns){
  state.tasks=state.tasks.map(t=>t.id===id?{...t,status:ns,updatedAt:new Date().toISOString(),activity:[...(t.activity||[]),{type:"moved",to:STS.find(s=>s.id===ns)?.label,at:new Date().toISOString(),by:state.clientPortal?"Cliente":"Equipo"}]}:t);
  saveState();render();
}

function getFiltered(){
  return state.tasks.filter(t=>{
    if(state.clientFilter!=="all"&&t.clientId!==state.clientFilter)return false;
    if(state.search&&!t.title.toLowerCase().includes(state.search.toLowerCase())&&!(t.description||"").toLowerCase().includes(state.search.toLowerCase()))return false;
    if(state.filterPriority!=="all"&&t.priority!==state.filterPriority)return false;
    if(state.filterAssignee!=="all"&&t.assigneeId!==state.filterAssignee)return false;
    return true;
  });
}

/* ═══════════════════════════════════════════
   RENDER HELPERS
   ═══════════════════════════════════════════ */
const h=(tag,attrs={},children="")=>{
  const parts=[`<${tag}`];
  for(const[k,v]of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object") parts.push(` style="${Object.entries(v).map(([a,b])=>`${a.replace(/([A-Z])/g,'-$1').toLowerCase()}:${b}`).join(';')}"`);
    else if(v!==undefined&&v!==false) parts.push(` ${k}="${String(v).replace(/"/g,'&quot;')}"`);
  }
  if(["br","hr","img","input"].includes(tag)) return parts.join("")+"/>";
  parts.push(">");
  if(Array.isArray(children)) parts.push(children.join(""));
  else parts.push(String(children));
  parts.push(`</${tag}>`);
  return parts.join("");
};

const avatar=(name,color,size=26)=>h("div",{class:"av",style:{width:size+"px",height:size+"px",background:color||"#94A3B8",fontSize:Math.round(size*.42)+"px"}},(name||"?")[0].toUpperCase());

const priorityBadge=(p)=>{const pr=PRIORITIES[p];return h("span",{class:"badge",style:{background:pr.bg,color:pr.text}},pr.label)};
const statusBadge=(sid)=>{const s=STS.find(x=>x.id===sid);return h("span",{class:"badge",style:{background:s.color+"14",color:s.color}},s.icon+" "+s.label)};

/* ═══════════════════════════════════════════
   COMPONENT RENDERERS
   ═══════════════════════════════════════════ */

function renderTaskCard(t,isClient=false){
  const pr=PRIORITIES[t.priority];
  const cl=state.clients.find(c=>c.id===t.clientId);
  const as=state.team.find(m=>m.id===t.assigneeId);
  const od=isOD(t.dueDate)&&t.status!=="completada";
  return h("div",{class:"task-card"+(isClient?" client-mode":""),draggable:!isClient,ondragstart:`event.dataTransfer.setData('text/plain','${t.id}')`,onclick:`setState({selectedTask:state.tasks.find(x=>x.id==='${t.id}')})`,style:{borderLeft:`3px solid ${isClient?pr.dot:cl?.color||"var(--border)"}`}},[
    h("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"7px"}},[
      h("span",{style:{fontSize:"9px",fontWeight:"800",textTransform:"uppercase",letterSpacing:".06em",background:pr.bg,color:pr.text,padding:"2px 7px",borderRadius:"4px"}},pr.label),
      !isClient&&cl?h("span",{style:{fontSize:"10px",color:cl.color,fontWeight:"700"}},cl.icon):"",
      h("span",{style:{fontSize:"10px",color:"var(--muted)",marginLeft:"auto"}},(t.category||"").split(" / ")[0])
    ]),
    h("div",{style:{fontSize:"13px",fontWeight:"700",color:"var(--text)",lineHeight:"1.35",marginBottom:"8px"}},t.title),
    h("div",{style:{display:"flex",alignItems:"center",gap:"8px",fontSize:"10px",color:"var(--muted)"}},[
      as?avatar(as.name,as.color,20):"",
      t.dueDate?h("span",{style:{color:od?"#DC2626":"var(--muted)",fontWeight:od?"700":"500"}},fmtD(t.dueDate)):"",
      (t.comments?.length)?h("span",{},"💬 "+t.comments.length):"",
      (t.links?.length)?h("span",{},"🔗 "+t.links.length):"",
      h("span",{style:{marginLeft:"auto"}},tAgo(t.createdAt))
    ])
  ]);
}

function renderColumn(col,tasks,isClient=false){
  return h("div",{class:"col",ondragover:"event.preventDefault();this.classList.add('drag-over')",ondragleave:"this.classList.remove('drag-over')",ondrop:`event.preventDefault();this.classList.remove('drag-over');moveTask(event.dataTransfer.getData('text/plain'),'${col.id}')`},[
    h("div",{class:"col-header"},[
      h("span",{class:"col-dot",style:{background:col.color}}),
      h("span",{class:"col-title"},col.label),
      h("span",{class:"col-count",style:{color:col.color,background:col.color+"14"}},String(tasks.length))
    ]),
    h("div",{class:"col-body"},tasks.map(t=>renderTaskCard(t,isClient)))
  ]);
}

function renderBoard(tasks,isClient=false){
  const cols=isClient?BOARD_STS:BOARD_STS;
  return h("div",{class:"board"},cols.map(col=>renderColumn(col,tasks.filter(t=>t.status===col.id),isClient)));
}

function renderListView(tasks,isClient=false){
  const headers=["Tarea",...(isClient?[]:["Cliente"]),"Estado","Prioridad","Categoría",...(isClient?[]:["Responsable"]),"Fecha"];
  return h("div",{style:{overflowX:"auto"}},
    h("table",{class:"tbl"},[
      h("thead",{},h("tr",{},headers.map(hd=>h("th",{},hd)).join(""))),
      h("tbody",{},tasks.map(t=>{
        const st=STS.find(s=>s.id===t.status);const pr=PRIORITIES[t.priority];const cl=state.clients.find(c=>c.id===t.clientId);const as=state.team.find(m=>m.id===t.assigneeId);
        return h("tr",{onclick:`setState({selectedTask:state.tasks.find(x=>x.id==='${t.id}')})`},[
          h("td",{style:{fontWeight:"700",color:"var(--text)",maxWidth:"260px"}},h("div",{style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},t.title)),
          !isClient?h("td",{},cl?h("span",{style:{fontSize:"10px",fontWeight:"700",color:cl.color}},cl.icon+" "+cl.name):""):"",
          h("td",{},statusBadge(t.status)),
          h("td",{},priorityBadge(t.priority)),
          h("td",{style:{color:"var(--sub)",fontSize:"11px"}},t.category||""),
          !isClient?h("td",{},as?avatar(as.name,as.color,18)+"<span style='font-size:11px;color:var(--sub);margin-left:5px'>"+as.name+"</span>":"—"):"",
          h("td",{style:{color:isOD(t.dueDate)&&t.status!=="completada"?"#DC2626":"var(--muted)",fontSize:"11px"}},t.dueDate?fmtD(t.dueDate):"—")
        ].join(""));
      }).join(""))
    ])
  );
}


/* ═══ DASHBOARD ═══ */
function renderDashboard(tasks){
  const cd=state.clients.map(c=>{const ct=tasks.filter(t=>t.clientId===c.id);return{...c,total:ct.length,activas:ct.filter(t=>t.status==="en_progreso"||t.status==="revision").length,terminadas:ct.filter(t=>t.status==="completada").length,sinArrancar:ct.filter(t=>t.status==="backlog"||t.status==="pendiente").length,paradas:ct.filter(t=>isPar(t)).length,overdue:ct.filter(t=>isOD(t.dueDate)&&t.status!=="completada").length}});
  const tA=tasks.filter(t=>t.status==="en_progreso"||t.status==="revision").length;
  const tD=tasks.filter(t=>t.status==="completada").length;

          h("span",{style:{fontSize:"12px",fontWeight:"800",color:pct===100?"#10B981":"var(--sub)",minWidth:"36px"}},pct+"%")
        ])

          h("th",{style:{color:"#DC2626"}},"⚠ Vencidas"),h("th",{style:{textAlign:"left"}},"Progreso")

      ]))

function submitTaskForm(isClient,isEdit){
  const title=document.getElementById("tf_title")?.value?.trim();
  if(!title)return;
  const desc=document.getElementById("tf_desc")?.value?.trim()||"";
  const cat=document.getElementById("tf_cat")?.value||CATS[0];
  const prio=document.getElementById("tf_prio")?.value||"media";
  const client=isClient?state.clientPortal:(document.getElementById("tf_client")?.value||state.clients[0]?.id);
  const assignee=isClient?"":(document.getElementById("tf_assignee")?.value||"");
  const due=isClient?"":(document.getElementById("tf_due")?.value||"");
  const status=isEdit?(document.getElementById("tf_status")?.value||"pendiente"):"pendiente";
  // Collect links
  const linkUrls=document.querySelectorAll(".tf-link-url");
  const linkLabels=document.querySelectorAll(".tf-link-label");
  const links=[];
  linkUrls.forEach((inp,i)=>{const url=inp.value.trim();if(url)links.push({url,label:linkLabels[i]?.value?.trim()||""});});
  const old=isEdit?state.selectedTask:{};
  const task={
    ...(old||{}),title,description:desc,priority:prio,category:cat,
    assigneeId:assignee,clientId:client,dueDate:due,status,links,
    id:old?.id||uid(),
    createdAt:old?.createdAt||new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    comments:old?.comments||[],
    activity:[...(old?.activity||[]),{type:isEdit?"edited":"created",at:new Date().toISOString(),by:isClient?"Cliente":"Equipo"}]
  };
  saveTask(task);
  setState({showForm:false,selectedTask:null});
}

// Link field helpers
function addLinkField(){
  const list=document.getElementById("tf_links_list");if(!list)return;
  const row=document.createElement("div");
  row.style.cssText="display:flex;gap:6px;align-items:center";
  row.innerHTML='<input class="inp tf-link-url" placeholder="https://..." style="flex:1;font-size:12px"><input class="inp tf-link-label" placeholder="Nombre (opcional)" style="width:140px;font-size:12px"><button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:#EF4444;font-size:14px;padding:4px">✕</button>';
  list.appendChild(row);
}
function removeLink(idx){
  // Re-render form with link removed
  const t=state.selectedTask||{links:[]};
  const links=[...(t.links||[])];links.splice(idx,1);
  if(state.selectedTask)state.selectedTask.links=links;
  render();
}

function addComment(taskId){
  const inp=document.getElementById("commentInput");
  if(!inp||!inp.value.trim())return;
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  const cl=state.clients.find(c=>c.id===t.clientId);
  const by=state.clientPortal?cl?.name||"Cliente":"Equipo";
  t.comments=[...(t.comments||[]),{id:uid(),text:inp.value.trim(),at:new Date().toISOString(),by}];
  t.activity=[...(t.activity||[]),{type:"comment",at:new Date().toISOString(),by}];
  t.updatedAt=new Date().toISOString();
  saveTask(t);
  setState({selectedTask:t});
}

function startAddConfig(){
  const tab=state.settingsTab;
  state.editingConfig={_new:true};
  state.editingForm=tab==="clients"?{name:"",color:PALETTE[Math.floor(Math.random()*PALETTE.length)],icon:EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}:{name:"",role:"",color:PALETTE[Math.floor(Math.random()*PALETTE.length)]};
  render();
}
function startEditConfig(id){
  const tab=state.settingsTab;
  const item=(tab==="clients"?state.clients:state.team).find(x=>x.id===id);if(!item)return;
  state.editingConfig=item;
  state.editingForm=tab==="clients"?{name:item.name,color:item.color,icon:item.icon}:{name:item.name,role:item.role,color:item.color};
  render();
}
function saveConfig(){
  const name=document.getElementById("cfg_name")?.value?.trim();if(!name)return;
  const role=document.getElementById("cfg_role")?.value?.trim()||"";
  const tab=state.settingsTab;const ef=state.editingConfig;const fm=state.editingForm;
  if(ef._new){
    const ni=tab==="clients"?{id:uid(),name,color:fm.color,icon:fm.icon}:{id:uid(),name,role,color:fm.color};
    if(tab==="clients")state.clients.push(ni);else state.team.push(ni);
  } else {
    if(tab==="clients")state.clients=state.clients.map(c=>c.id===ef.id?{...c,name,color:fm.color,icon:fm.icon}:c);
    else state.team=state.team.map(m=>m.id===ef.id?{...m,name,role,color:fm.color}:m);
  }
  state.editingConfig=null;saveState();render();
}
function deleteConfig(id){
  const tab=state.settingsTab;
  if(tab==="clients")state.clients=state.clients.filter(c=>c.id!==id);
  else state.team=state.team.filter(m=>m.id!==id);
  saveState();render();
}

/* ═══ IMPORT EXCEL ═══ */
function importExcel(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      let imported=0;
      rows.forEach(row=>{
        // Try to find columns by common names
        const title=row["Tema"]||row["tema"]||row["Titulo"]||row["titulo"]||row["Title"]||row["title"]||row["Tarea"]||row["tarea"]||"";
        if(!title)return;
        const desc=row["Comentarios"]||row["comentarios"]||row["Descripcion"]||row["descripcion"]||row["Description"]||"";
        const statusRaw=(row["Status"]||row["status"]||row["Estado"]||row["estado"]||"pendiente").toString().toLowerCase().trim();
        const marca=row["Marca"]||row["marca"]||row["Cliente"]||row["cliente"]||row["Brand"]||"";
        const owner=row["Owner"]||row["owner"]||row["Responsable"]||row["responsable"]||"";
        const deadlineRaw=row["Deadline"]||row["deadline"]||row["Fecha limite"]||row["fecha_limite"]||"";
        const startRaw=row["Fecha de inicio"]||row["fecha_inicio"]||row["Fecha"]||row["fecha"]||"";
        // Find last column that looks like a URL
        let link="";
        Object.values(row).forEach(v=>{if(typeof v==="string"&&(v.startsWith("http://")||v.startsWith("https://")))link=v;});

        // Map status
        let status="pendiente";
        if(statusRaw.includes("complet")||statusRaw.includes("aprobad"))status="completada";
        else if(statusRaw.includes("progres"))status="en_progreso";
        else if(statusRaw.includes("revis"))status="revision";
        else if(statusRaw.includes("pendient"))status="pendiente";

        // Match client
        let clientId=state.clients[0]?.id||"";
        const marcaLow=marca.toLowerCase();
        state.clients.forEach(c=>{
          if(marcaLow.includes(c.name.toLowerCase())||c.name.toLowerCase().includes(marcaLow)){clientId=c.id;}
          // Partial matches
          if(marcaLow.includes("pileta")&&c.id==="mipileta")clientId=c.id;
          if(marcaLow.includes("anteq")&&c.id==="antequera")clientId=c.id;
          if(marcaLow.includes("anm")&&c.id==="anm")clientId=c.id;
          if(marcaLow.includes("avanti")&&c.id==="avanti")clientId=c.id;
          if(marcaLow.includes("froz")&&c.id==="froz")clientId=c.id;
        });
        if(marcaLow.includes("todos"))clientId=state.clients[0]?.id||"";

        // Match owner
        let assigneeId="";
        const ownerLow=owner.toLowerCase();
        state.team.forEach(m=>{
          if(ownerLow.includes(m.name.toLowerCase()))assigneeId=m.id;
        });
        if(ownerLow.includes("lui")&&!ownerLow.includes("luisi"))state.team.forEach(m=>{if(m.name==="Lucía")assigneeId=m.id;});
        if(ownerLow.includes("luisi"))state.team.forEach(m=>{if(m.name==="Luisina")assigneeId=m.id;});
        if(ownerLow.includes("dio"))state.team.forEach(m=>{if(m.name==="Diógenes")assigneeId=m.id;});
        if(ownerLow.includes("santi"))state.team.forEach(m=>{if(m.name==="Santiago")assigneeId=m.id;});

        // Parse dates
        let dueDate="";
        if(deadlineRaw){
          try{
            const d=deadlineRaw instanceof Date?deadlineRaw:new Date(deadlineRaw);
            if(!isNaN(d))dueDate=d.toISOString().split("T")[0];
          }catch{}
        }
        let createdAt=new Date().toISOString();
        if(startRaw){
          try{
            const d=startRaw instanceof Date?startRaw:new Date(startRaw);
            if(!isNaN(d))createdAt=d.toISOString();
          }catch{}
        }

        // Build links
        const links=[];
        if(link)links.push({url:link.replace(/\\\\/g,""),label:"Link"});

        // Check duplicate by title+client
        const exists=state.tasks.some(t=>t.title===title&&t.clientId===clientId);
        if(exists)return;

        state.tasks.push({
          id:uid(),title,description:desc,priority:"media",
          category:"Otro",assigneeId,clientId,dueDate,status,links,
          createdAt,updatedAt:createdAt,comments:[],
          activity:[{type:"created",at:createdAt,by:"Importado"}]
        });
        imported++;
      });
      input.value="";
      saveState();render();
      alert("✅ Se importaron "+imported+" tareas correctamente"+(imported===0?" (puede que ya estuvieran cargadas)":""));
    }catch(err){
      alert("❌ Error al leer el archivo: "+err.message);
      input.value="";
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ═══ CHARTS ═══ */
let pieChartInstance=null,barChartInstance=null;
function renderCharts(tasks){
  setTimeout(()=>{
    // Pie
    const pieEl=document.getElementById("pieChart");
    if(pieEl){
      if(pieChartInstance)pieChartInstance.destroy();
      const pd=STS.map(s=>({label:s.label,value:tasks.filter(t=>t.status===s.id).length,color:s.color})).filter(d=>d.value>0);
      pieChartInstance=new Chart(pieEl,{
        type:"doughnut",
        data:{labels:pd.map(d=>d.label),datasets:[{data:pd.map(d=>d.value),backgroundColor:pd.map(d=>d.color),borderWidth:0}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{color:"#5C6278",font:{size:10,family:"Outfit"},padding:12,usePointStyle:true,pointStyle:"circle"}},tooltip:{backgroundColor:"#181A23",titleColor:"#E8ECF4",bodyColor:"#9CA3B4",borderColor:"#2A2D3A",borderWidth:1,titleFont:{family:"Outfit",weight:"700"},bodyFont:{family:"Outfit"}}}}
      });
    }
    // Bar
    const barEl=document.getElementById("barChart");
    if(barEl){
      if(barChartInstance)barChartInstance.destroy();
      const cd=state.clients.map(c=>{const ct=tasks.filter(t=>t.clientId===c.id);return{name:c.name.length>12?c.name.substring(0,12)+"…":c.name,activas:ct.filter(t=>t.status==="en_progreso"||t.status==="revision").length,terminadas:ct.filter(t=>t.status==="completada").length,sinArrancar:ct.filter(t=>t.status==="backlog"||t.status==="pendiente").length,paradas:ct.filter(t=>isPar(t)).length}});
      barChartInstance=new Chart(barEl,{
        type:"bar",
        data:{labels:cd.map(d=>d.name),datasets:[
          {label:"Activas",data:cd.map(d=>d.activas),backgroundColor:"#3B82F6",borderRadius:3},
          {label:"Terminadas",data:cd.map(d=>d.terminadas),backgroundColor:"#10B981",borderRadius:0},
          {label:"Sin arrancar",data:cd.map(d=>d.sinArrancar),backgroundColor:"#64748B",borderRadius:0},
          {label:"Paradas",data:cd.map(d=>d.paradas),backgroundColor:"#F59E0B",borderRadius:3}
        ]},
        options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{color:"#5C6278",font:{size:10,family:"Outfit"}},grid:{display:false}},y:{stacked:true,ticks:{color:"#5C6278",font:{size:10,family:"Outfit"},stepSize:1},grid:{color:"#2A2D3A22"}}},plugins:{legend:{position:"bottom",labels:{color:"#5C6278",font:{size:10,family:"Outfit"},padding:12,usePointStyle:true,pointStyle:"circle"}},tooltip:{backgroundColor:"#181A23",titleColor:"#E8ECF4",bodyColor:"#9CA3B4",borderColor:"#2A2D3A",borderWidth:1,titleFont:{family:"Outfit",weight:"700"},bodyFont:{family:"Outfit"}}}}
      });
    }
  },50);
}

/* ═══ MAIN RENDER ═══ */
function render(){
  const app=document.getElementById("app");
  const loading=document.getElementById("app-loading");
  loading.classList.add("hidden");
  app.classList.remove("hidden");

  if(state.clientPortal){
    app.style.display="flex";
    app.innerHTML=h("div",{style:{flex:"1",display:"flex",flexDirection:"column",minHeight:"100vh"}},renderClientPortal());
    // Modals
    if(state.showForm)app.innerHTML+=renderTaskForm(true);
    if(state.selectedTask&&!state.showForm)app.innerHTML+=renderTaskDetail();
    return;
  }

  const filtered=getFiltered();
  let content="";
  if(state.view==="dashboard"){
    const dtasks=state.clientFilter==="all"?state.tasks:state.tasks.filter(t=>t.clientId===state.clientFilter);
    content=renderDashboard(dtasks);
  } else if(filtered.length===0&&state.tasks.length===0){
    content=h("div",{class:"empty"},[h("div",{class:"empty-icon"},"📋"),h("div",{class:"empty-title"},"Sin tareas todavía"),h("div",{class:"empty-sub"},"Creá la primera tarea para arrancar"),h("button",{class:"btn btn-primary",onclick:"setState({showForm:true})",style:{margin:"0 auto"}},"➕ Crear tarea")]);
  } else if(filtered.length===0){
    content=h("div",{class:"empty"},[h("div",{style:{fontSize:"32px",marginBottom:"10px"}},"🔍"),h("div",{style:{fontSize:"14px",fontWeight:"600"}},"No hay tareas con esos filtros")]);
  } else if(state.view==="board"){
    content=renderBoard(filtered);
  } else {
    content=renderListView(filtered);
  }

  app.style.display="flex";
  app.innerHTML=[
    h("div",{id:"sidebar"},renderSidebar()),
    h("div",{id:"main"},[
      h("div",{id:"header"},renderHeader()),
      h("div",{id:"content"},content)
    ])
  ].join("");

  // Modals
  if(state.showForm)app.innerHTML+=renderTaskForm(false);
  if(state.selectedTask&&!state.showForm)app.innerHTML+=renderTaskDetail();
  if(state.showSettings)app.innerHTML+=renderSettings();

  // Charts
  if(state.view==="dashboard"&&!state.clientPortal){
    const dtasks=state.clientFilter==="all"?state.tasks:state.tasks.filter(t=>t.clientId===state.clientFilter);
    renderCharts(dtasks);
  }
}

// Init
render();
