<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANM Studio — Task Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0F1117;--card:#181A23;--surface:#1E2029;--col-hover:#252731;--border:#2A2D3A;--text:#E8ECF4;--sub:#9CA3B4;--muted:#5C6278;--accent:#4F8CFF;--accent-soft:rgba(79,140,255,.09);--accent-hover:#3A75E8;--input:#1A1C26}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
select{appearance:auto;font-family:inherit}button{font-family:inherit}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:flex;min-height:100vh}
#sidebar{width:220px;flex-shrink:0;padding:20px 14px;border-right:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;gap:4px;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#content{flex:1;overflow:auto;padding:20px 24px}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.sb-logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#7C3AED,#2563EB);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px}
.sb-title{font-size:14px;font-weight:900;color:var(--text)}.sb-sub{font-size:10px;color:var(--muted)}
.sb-nav{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;border-radius:8px;border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:500;cursor:pointer;text-align:left}
.sb-nav.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.sb-nav:hover{background:var(--accent-soft)}
.sb-section{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px;margin:20px 0 6px}
.sb-client{display:flex;gap:2px}
.sb-client-btn{display:flex;align-items:center;gap:9px;flex:1;padding:7px 12px;border-radius:8px 0 0 8px;border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:500;cursor:pointer;text-align:left}
.sb-client-btn.active{font-weight:700}
.sb-client-portal{padding:7px 8px;border-radius:0 8px 8px 0;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center}
.sb-team{display:flex;align-items:center;gap:8px;padding:5px 12px}
.sb-team-name{font-size:11px;font-weight:700;color:var(--text)}.sb-team-role{font-size:9px;color:var(--muted)}
.av{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.card{background:var(--card);border-radius:12px;padding:18px 20px;border:1px solid var(--border)}
.stat-num{font-size:28px;font-weight:900;line-height:1;letter-spacing:-0.03em}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.chart-row{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:16px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.tbl th{text-align:left;padding:10px 12px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;border-bottom:2px solid var(--border)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border)}.tbl tr:hover td{background:var(--surface)}.tbl tr{cursor:pointer}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block}
.task-card{background:var(--card);border-radius:10px;padding:13px 15px;margin-bottom:7px;border:1px solid var(--border);cursor:grab;transition:box-shadow .12s,transform .12s}
.task-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);transform:translateY(-1px)}.task-card.client-mode{cursor:pointer}
.col{flex:1 1 260px;min-width:250px;max-width:340px;background:var(--surface);border-radius:14px;padding:10px 10px 6px;display:flex;flex-direction:column;transition:background .1s}
.col.drag-over{background:var(--col-hover)}
.col-header{display:flex;align-items:center;gap:7px;padding:6px 6px 12px}
.col-dot{width:8px;height:8px;border-radius:50%}.col-title{font-size:12px;font-weight:800;color:var(--text)}
.col-count{margin-left:auto;font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px}.col-body{flex:1;overflow-y:auto;min-height:40px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(6px);animation:fadeIn .12s ease}
.modal-box{background:var(--card);border-radius:16px;width:100%;padding:28px 32px;box-shadow:0 30px 80px rgba(0,0,0,.25),0 0 0 1px var(--border);animation:slideUp .18s ease}
.modal-box.normal{max-width:540px}.modal-box.wide{max-width:720px}
.inp{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--input);color:var(--text);font-size:13px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--accent)}
.lbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.btn{padding:9px 24px;border-radius:8px;border:none;font-size:12px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--sub)}
.btn-danger{background:#FEF2F2;border:1px solid #FCA5A5;color:#DC2626}
.mini-stat{text-align:center;padding:12px 16px;background:var(--surface);border-radius:10px;flex:1 1 90px}
.mini-stat-num{font-size:22px;font-weight:900;letter-spacing:-0.03em}
.mini-stat-label{font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.color-pick{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border .1s}
.color-pick.sel{border-color:var(--text)}
.emoji-pick{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.emoji-pick.sel{background:var(--accent)}
.settings-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:4px;background:var(--surface)}
.move-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s}.move-btn:hover{opacity:.8}
.prog-bar{height:7px;border-radius:4px;background:var(--surface);overflow:hidden;min-width:80px}
.prog-fill{height:100%;border-radius:4px;transition:width .4s}
.team-bar{display:flex;gap:4px;margin-top:5px}.team-bar-seg{height:5px;border-radius:3px}
.act-dot{width:5px;height:5px;border-radius:50%;background:var(--border);flex-shrink:0}
.portal-header{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--card)}
.portal-stats{display:flex;gap:8px;margin-top:14px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:44px;margin-bottom:14px}.empty-title{font-size:17px;font-weight:800;color:var(--sub);margin-bottom:8px}
.empty-sub{font-size:13px;margin-bottom:24px}
.tab-btn{padding:8px 18px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.tab-btn.active{background:var(--accent);color:#fff}.tab-btn:not(.active){background:var(--surface);color:var(--sub)}
.hidden{display:none!important}
.sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.sync-online{background:#10B981}.sync-offline{background:#EF4444}
@media(max-width:768px){#sidebar{display:none}.chart-row{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(3,1fr)}}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.dash-tbl td{text-align:center}.dash-tbl td:first-child{text-align:left}.dash-tbl td:last-child{text-align:left}
.status-cell{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:32px;border-radius:8px;font-size:15px;font-weight:900;padding:0 10px}
</style>
</head>
<body>
<div id="app-loading" class="loading">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:13px;font-weight:600">Conectando con Supabase...</div>
</div>
<div id="app" class="hidden"></div>
<script>
/* ═══ SUPABASE CONNECTION ═══ */
const SUPABASE_URL="https://wikztqeuexdxepczqfzj.supabase.co";
const SUPABASE_KEY="sb_publishable_I3m8z2625_mGaqfHFUl8kw_t4vC2JU0";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ═══ CONSTANTS ═══ */
const PRIORITIES={urgente:{label:"Urgente",bg:"#FEE2E2",text:"#991B1B",dot:"#DC2626"},alta:{label:"Alta",bg:"#FFEDD5",text:"#9A3412",dot:"#F97316"},media:{label:"Media",bg:"#FEF3C7",text:"#92400E",dot:"#F59E0B"},baja:{label:"Baja",bg:"#DBEAFE",text:"#1E40AF",dot:"#3B82F6"}};
const CATS=["Web / eCommerce","Diseño Gráfico","Redes Sociales","Contenido / Copy","Email Marketing","SEO / SEM","Datos / Analytics","Estrategia","Reunión","Otro"];
const STS=[{id:"backlog",label:"Backlog",icon:"⊘",color:"#94A3B8"},{id:"pendiente",label:"Pendiente",icon:"○",color:"#64748B"},{id:"en_progreso",label:"En Progreso",icon:"◐",color:"#3B82F6"},{id:"revision",label:"En Revisión",icon:"◑",color:"#F59E0B"},{id:"completada",label:"Completada",icon:"●",color:"#10B981"}];
const BOARD_STS=STS.filter(s=>s.id!=="backlog");
const EMOJIS=["🧊","🚿","🏡","🎬","🚀","🏢","💎","🔥","⚡","🎯","🌟","📱","🛍️","🍕","🎨","💄","👗","🏋️","🌿","🐾"];
const PALETTE=["#2563EB","#7C3AED","#06B6D4","#D97706","#059669","#EC4899","#EF4444","#F59E0B","#10B981","#64748B","#8B5CF6","#14B8A6"];

const uid=()=>Date.now().toString(36)+Math.random().toString(36).substr(2,6);
const fmtD=d=>d?new Date(d).toLocaleDateString("es-AR",{day:"2-digit",month:"short"}):"";
const tAgo=iso=>{const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return"ahora";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";if(s<604800)return Math.floor(s/86400)+"d";return fmtD(iso)};
const isOD=d=>d&&new Date(d)<new Date(new Date().toDateString());
const isPar=t=>{if(t.status==="completada"||t.status==="backlog"||!t.updated_at)return false;return(Date.now()-new Date(t.updated_at))/864e5>3};

/* ═══ STATE ═══ */
let state={tasks:[],clients:[],team:[],view:"dashboard",clientFilter:"all",clientPortal:null,search:"",filterPriority:"all",filterAssignee:"all",selectedTask:null,showForm:false,showSettings:false,settingsTab:"clients",editingConfig:null,editingForm:{},dbConnected:false};

function ss(updates){Object.assign(state,updates);render();}

/* ═══ SUPABASE DATA OPERATIONS ═══ */
async function loadAll(){
  try{
    const [ct,tm,tk]=await Promise.all([
      sb.from("clients").select("*").order("created_at"),
      sb.from("team").select("*").order("created_at"),
      sb.from("tasks").select("*").order("created_at",{ascending:false})
    ]);
    state.clients=ct.data||[];
    state.team=tm.data||[];
    state.tasks=tk.data||[];
    state.dbConnected=true;
  }catch(err){console.error("Load error:",err);state.dbConnected=false;}
  document.getElementById("app-loading").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  render();
}

async function saveTask(task){
  const isNew=!state.tasks.find(t=>t.id===task.id);
  // Map to DB columns
  const row={id:task.id,title:task.title,description:task.description||"",priority:task.priority||"media",category:task.category||"Otro",status:task.status||"pendiente",client_id:task.client_id||null,assignee_id:task.assignee_id||null,due_date:task.due_date||null,links:task.links||[],comments:task.comments||[],activity:task.activity||[],updated_at:new Date().toISOString()};
  if(isNew)row.created_at=task.created_at||new Date().toISOString();
  const{data,error}=isNew?await sb.from("tasks").insert(row).select():await sb.from("tasks").update(row).eq("id",task.id).select();
  if(error){console.error("Save error:",error);alert("Error guardando: "+error.message);return;}
  if(data&&data[0]){
    const idx=state.tasks.findIndex(t=>t.id===task.id);
    if(idx>=0)state.tasks[idx]=data[0];else state.tasks.unshift(data[0]);
    if(state.selectedTask?.id===task.id)state.selectedTask=data[0];
  }
  render();
}

async function deleteTask(id){
  await sb.from("tasks").delete().eq("id",id);
  state.tasks=state.tasks.filter(t=>t.id!==id);
  state.selectedTask=null;render();
}

async function moveTask(id,ns){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const activity=[...(t.activity||[]),{type:"moved",to:STS.find(s=>s.id===ns)?.label,at:new Date().toISOString(),by:state.clientPortal?"Cliente":"Equipo"}];
  const{data}=await sb.from("tasks").update({status:ns,updated_at:new Date().toISOString(),activity}).eq("id",id).select();
  if(data&&data[0]){const idx=state.tasks.findIndex(x=>x.id===id);if(idx>=0)state.tasks[idx]=data[0];}
  render();
}

async function saveClient(cl,isNew){
  const{data}=isNew?await sb.from("clients").insert(cl).select():await sb.from("clients").update(cl).eq("id",cl.id).select();
  if(data&&data[0]){if(isNew)state.clients.push(data[0]);else{const i=state.clients.findIndex(c=>c.id===cl.id);if(i>=0)state.clients[i]=data[0];}}
  render();
}
async function deleteClient(id){await sb.from("clients").delete().eq("id",id);state.clients=state.clients.filter(c=>c.id!==id);render();}
async function saveTeamMember(m,isNew){
  const{data}=isNew?await sb.from("team").insert(m).select():await sb.from("team").update(m).eq("id",m.id).select();
  if(data&&data[0]){if(isNew)state.team.push(data[0]);else{const i=state.team.findIndex(x=>x.id===m.id);if(i>=0)state.team[i]=data[0];}}
  render();
}
async function deleteTeamMember(id){await sb.from("team").delete().eq("id",id);state.team=state.team.filter(m=>m.id!==id);render();}

/* ═══ REALTIME SUBSCRIPTIONS ═══ */
function setupRealtime(){
  sb.channel("all-changes")
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},()=>loadAll())
    .on("postgres_changes",{event:"*",schema:"public",table:"clients"},()=>loadAll())
    .on("postgres_changes",{event:"*",schema:"public",table:"team"},()=>loadAll())
    .subscribe();
}

/* ═══ RENDER HELPERS ═══ */
const h=(tag,attrs={},children="")=>{const parts=[`<${tag}`];for(const[k,v]of Object.entries(attrs)){if(k==="style"&&typeof v==="object")parts.push(` style="${Object.entries(v).map(([a,b])=>`${a.replace(/([A-Z])/g,'-$1').toLowerCase()}:${b}`).join(';')}"`);else if(v!==undefined&&v!==false)parts.push(` ${k}="${String(v).replace(/"/g,'&quot;')}"`);}if(["br","hr","img","input"].includes(tag))return parts.join("")+"/>";parts.push(">");if(Array.isArray(children))parts.push(children.join(""));else parts.push(String(children));parts.push(`</${tag}>`);return parts.join("");};
const avatar=(name,color,size=26)=>h("div",{class:"av",style:{width:size+"px",height:size+"px",background:color||"#94A3B8",fontSize:Math.round(size*.42)+"px"}},(name||"?")[0].toUpperCase());
const priorityBadge=p=>{const pr=PRIORITIES[p];return h("span",{class:"badge",style:{background:pr.bg,color:pr.text}},pr.label)};
const statusBadge=sid=>{const s=STS.find(x=>x.id===sid);return h("span",{class:"badge",style:{background:s.color+"14",color:s.color}},s.icon+" "+s.label)};

/* ═══ TASK CARD ═══ */
function renderTaskCard(t,isClient=false){
  const pr=PRIORITIES[t.priority];const cl=state.clients.find(c=>c.id===t.client_id);const as=state.team.find(m=>m.id===t.assignee_id);const od=isOD(t.due_date)&&t.status!=="completada";
  return h("div",{class:"task-card"+(isClient?" client-mode":""),draggable:!isClient,ondragstart:`event.dataTransfer.setData('text/plain','${t.id}')`,onclick:`state.selectedTask=state.tasks.find(x=>x.id==='${t.id}');render()`,"style":{borderLeft:`3px solid ${isClient?pr.dot:cl?.color||"var(--border)"}`}},[
    h("div",{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"7px"}},[
      h("span",{style:{fontSize:"9px",fontWeight:"800",textTransform:"uppercase",letterSpacing:".06em",background:pr.bg,color:pr.text,padding:"2px 7px",borderRadius:"4px"}},pr.label),
      !isClient&&cl?h("span",{style:{fontSize:"10px",color:cl.color,fontWeight:"700"}},cl.icon):"",
      h("span",{style:{fontSize:"10px",color:"var(--muted)",marginLeft:"auto"}},(t.category||"").split(" / ")[0])
    ]),
    h("div",{style:{fontSize:"13px",fontWeight:"700",color:"var(--text)",lineHeight:"1.35",marginBottom:"8px"}},t.title),
    h("div",{style:{display:"flex",alignItems:"center",gap:"8px",fontSize:"10px",color:"var(--muted)"}},[
      as?avatar(as.name,as.color,20):"",
      t.due_date?h("span",{style:{color:od?"#DC2626":"var(--muted)",fontWeight:od?"700":"500"}},fmtD(t.due_date)):"",
      (t.comments?.length)?h("span",{},"💬 "+t.comments.length):"",
      (t.links?.length)?h("span",{},"🔗 "+t.links.length):"",
      h("span",{style:{marginLeft:"auto"}},tAgo(t.created_at))
    ])
  ]);
}

function renderColumn(col,tasks,isClient=false){
  return h("div",{class:"col",ondragover:"event.preventDefault();this.classList.add('drag-over')",ondragleave:"this.classList.remove('drag-over')",ondrop:`event.preventDefault();this.classList.remove('drag-over');moveTask(event.dataTransfer.getData('text/plain'),'${col.id}')`},[
    h("div",{class:"col-header"},[h("span",{class:"col-dot",style:{background:col.color}}),h("span",{class:"col-title"},col.label),h("span",{class:"col-count",style:{color:col.color,background:col.color+"14"}},String(tasks.length))]),
    h("div",{class:"col-body"},tasks.map(t=>renderTaskCard(t,isClient)))
  ]);
}
function renderBoard(tasks,isClient=false){return h("div",{class:"board"},BOARD_STS.map(col=>renderColumn(col,tasks.filter(t=>t.status===col.id),isClient)));}

function renderListView(tasks,isClient=false){
  const headers=["Tarea",...(isClient?[]:["Cliente"]),"Estado","Prioridad","Categoría",...(isClient?[]:["Responsable"]),"Fecha"];
  return h("div",{style:{overflowX:"auto"}},h("table",{class:"tbl"},[
    h("thead",{},h("tr",{},headers.map(hd=>h("th",{},hd)).join(""))),
    h("tbody",{},tasks.map(t=>{
      const st=STS.find(s=>s.id===t.status);const pr=PRIORITIES[t.priority];const cl=state.clients.find(c=>c.id===t.client_id);const as=state.team.find(m=>m.id===t.assignee_id);
      return h("tr",{onclick:`state.selectedTask=state.tasks.find(x=>x.id==='${t.id}');render()`},[
        h("td",{style:{fontWeight:"700",color:"var(--text)",maxWidth:"260px"}},h("div",{style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},t.title)),
        !isClient?h("td",{},cl?h("span",{style:{fontSize:"10px",fontWeight:"700",color:cl.color}},cl.icon+" "+cl.name):""):"",
        h("td",{},statusBadge(t.status)),h("td",{},priorityBadge(t.priority)),

/* ═══ IMPORT EXCEL ═══ */
async function importExcel(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
      const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",blankrows:false});
      let headerIdx=-1,headers=[];
      for(let i=0;i<Math.min(allRows.length,10);i++){const row=allRows[i].map(c=>String(c).trim().toLowerCase());if(row.includes("tema")||row.includes("marca")||row.includes("status")){headerIdx=i;headers=allRows[i].map(c=>String(c).trim());break;}}
      if(headerIdx===-1){input.value="";alert("No se encontraron las columnas (Tema, Marca, Status)");return;}
      const cm={};headers.forEach((hd,i)=>{const hl=hd.toLowerCase();if(hl.includes("tema")||hl.includes("título"))cm.title=i;if(hl.includes("marca")||hl.includes("cliente"))cm.marca=i;if(hl.includes("comentario")||hl.includes("descripci"))cm.desc=i;if(hl.includes("status")||hl.includes("estado"))cm.status=i;if(hl.includes("deadline")||hl.includes("fecha lim"))cm.deadline=i;if(hl.includes("fecha de inicio")||(hl.includes("fecha")&&!hl.includes("lim")))cm.start=i;if(hl.includes("owner")||hl.includes("responsable"))cm.owner=i;});
      let imported=0;
      for(let r=headerIdx+1;r<allRows.length;r++){
        const row=allRows[r];if(!row||row.length<3)continue;
        const title=String(row[cm.title]||"").trim();if(!title)continue;
        const marca=String(row[cm.marca]||"").trim();const desc=String(row[cm.desc]||"").trim();
        const sRaw=String(row[cm.status]||"pendiente").toLowerCase();const oRaw=String(row[cm.owner]||"").trim();
        const dlRaw=row[cm.deadline]||"";const stRaw=row[cm.start]||"";
        let link="";row.forEach(v=>{const s=String(v||"");if(s.startsWith("http"))link=s;});
        let status="pendiente";if(sRaw.includes("complet")||sRaw.includes("aprobad"))status="completada";else if(sRaw.includes("progres"))status="en_progreso";else if(sRaw.includes("revis"))status="revision";
        let client_id=state.clients[0]?.id||"";const ml=marca.toLowerCase();
        if(ml.includes("pileta"))client_id="mipileta";else if(ml.includes("anteq"))client_id="antequera";else if(ml.includes("anm"))client_id="anm";else if(ml.includes("avanti"))client_id="avanti";else if(ml.includes("froz"))client_id="froz";
        else{state.clients.forEach(c=>{if(ml.includes(c.name.toLowerCase()))client_id=c.id;});}
        let assignee_id=null;const ol=oRaw.toLowerCase();
        if(ol.includes("luisi"))assignee_id="luisina";else if(ol.includes("luli")||ol.includes("lucí")||ol.includes("lucia"))assignee_id="lucia";
        if(ol.includes("dio"))assignee_id="dio";if(ol.includes("santi"))assignee_id="santi";
        if(!assignee_id){state.team.forEach(m=>{if(ol.includes(m.name.toLowerCase()))assignee_id=m.id;});}
        let due_date=null;if(dlRaw){try{const d=dlRaw instanceof Date?dlRaw:new Date(dlRaw);if(!isNaN(d.getTime()))due_date=d.toISOString().split("T")[0];}catch{}}
        let created_at=new Date().toISOString();if(stRaw){try{const d=stRaw instanceof Date?stRaw:new Date(stRaw);if(!isNaN(d.getTime()))created_at=d.toISOString();}catch{}}
        const links=[];if(link)links.push({url:link.replace(/\\\\/g,"").replace(/\\_/g,"_"),label:"Link"});
        const exists=state.tasks.some(t=>t.title===title&&t.client_id===client_id);if(exists)continue;
        await saveTask({id:uid(),title,description:desc,priority:"media",category:"Otro",assignee_id,client_id,due_date,status,links,comments:[],activity:[{type:"created",at:created_at,by:"Importado"}],created_at});
        imported++;
      }
      input.value="";alert("✅ Se importaron "+imported+" tareas");
    }catch(err){alert("❌ Error: "+err.message);input.value="";}
  };
  reader.readAsArrayBuffer(file);
}

/* ═══ CHARTS ═══ */

function renderCharts(tasks){

    const pe=document.getElementById("pieChart");
    if(pe){if(pieC)pieC.destroy();const pd=STS.map(s=>({label:s.label,value:tasks.filter(t=>t.status===s.id).length,color:s.color})).filter(d=>d.value>0);
    pieC=new Chart(pe,{type:"doughnut",data:{labels:pd.map(d=>d.label),datasets:[{data:pd.map(d=>d.value),backgroundColor:pd.map(d=>d.color),borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{position:"bottom",labels:{color:"#5C6278",font:{size:10,family:"Outfit"},padding:12,usePointStyle:true,pointStyle:"circle"}},tooltip:{backgroundColor:"#181A23",titleColor:"#E8ECF4",bodyColor:"#9CA3B4",borderColor:"#2A2D3A",borderWidth:1}}}});}
    const be=document.getElementById("barChart");
    if(be){if(barC)barC.destroy();const cd=state.clients.map(c=>{const ct=tasks.filter(t=>t.client_id===c.id);return{name:c.name.length>12?c.name.substring(0,12)+"…":c.name,a:ct.filter(t=>t.status==="en_progreso"||t.status==="revision").length,t:ct.filter(t=>t.status==="completada").length,s:ct.filter(t=>t.status==="backlog"||t.status==="pendiente").length,p:ct.filter(t=>isPar(t)).length}});
    barC=new Chart(be,{type:"bar",data:{labels:cd.map(d=>d.name),datasets:[{label:"Activas",data:cd.map(d=>d.a),backgroundColor:"#3B82F6",borderRadius:3},{label:"Terminadas",data:cd.map(d=>d.t),backgroundColor:"#10B981"},{label:"Sin arrancar",data:cd.map(d=>d.s),backgroundColor:"#64748B"},{label:"Paradas",data:cd.map(d=>d.p),backgroundColor:"#F59E0B",borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true,ticks:{color:"#5C6278",font:{size:10}},grid:{display:false}},y:{stacked:true,ticks:{color:"#5C6278",font:{size:10},stepSize:1},grid:{color:"#2A2D3A22"}}},plugins:{legend:{position:"bottom",labels:{color:"#5C6278",font:{size:10},padding:12,usePointStyle:true,pointStyle:"circle"}},tooltip:{backgroundColor:"#181A23",titleColor:"#E8ECF4",bodyColor:"#9CA3B4"}}}});}
  },50);
}

/* ═══ MAIN RENDER ═══ */
function getFiltered(){return state.tasks.filter(t=>{if(state.clientFilter!=="all"&&t.client_id!==state.clientFilter)return false;if(state.search&&!t.title.toLowerCase().includes(state.search.toLowerCase())&&!(t.description||"").toLowerCase().includes(state.search.toLowerCase()))return false;if(state.filterPriority!=="all"&&t.priority!==state.filterPriority)return false;if(state.filterAssignee!=="all"&&t.assignee_id!==state.filterAssignee)return false;return true;});}

function render(){
  const app=document.getElementById("app");
  if(state.clientPortal){
    app.style.display="flex";app.innerHTML=h("div",{style:{flex:"1",display:"flex",flexDirection:"column",minHeight:"100vh"}},renderClientPortal());
    if(state.showForm)app.innerHTML+=renderTaskForm(true);
    if(state.selectedTask&&!state.showForm)app.innerHTML+=renderTaskDetail();
    return;
  }
  const filtered=getFiltered();let content="";
  if(state.view==="dashboard"){const dt=state.clientFilter==="all"?state.tasks:state.tasks.filter(t=>t.client_id===state.clientFilter);content=renderDashboard(dt);}
  else if(filtered.length===0&&state.tasks.length===0)content=h("div",{class:"empty"},[h("div",{class:"empty-icon"},"📋"),h("div",{class:"empty-title"},"Sin tareas todavía"),h("button",{class:"btn btn-primary",onclick:"ss({showForm:true})",style:{margin:"0 auto"}},"➕ Crear tarea")]);
  else if(filtered.length===0)content=h("div",{class:"empty"},[h("div",{style:{fontSize:"32px",marginBottom:"10px"}},"🔍"),h("div",{style:{fontSize:"14px",fontWeight:"600"}},"No hay tareas con esos filtros")]);
  else if(state.view==="board")content=renderBoard(filtered);
  else content=renderListView(filtered);
  app.style.display="flex";
  app.innerHTML=[h("div",{id:"sidebar"},renderSidebar()),h("div",{id:"main"},[h("div",{id:"header"},renderHeader()),h("div",{id:"content"},content)])].join("");
  if(state.showForm)app.innerHTML+=renderTaskForm(false);
  if(state.selectedTask&&!state.showForm)app.innerHTML+=renderTaskDetail();
  if(state.showSettings)app.innerHTML+=renderSettings();
  if(state.view==="dashboard"&&!state.clientPortal){const dt=state.clientFilter==="all"?state.tasks:state.tasks.filter(t=>t.client_id===state.clientFilter);renderCharts(dt);}
}
